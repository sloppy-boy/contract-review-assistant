<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>合同审查助手 · 三版视觉预览</title>
  <style>
    /* Design system preview: 中文、规范级字号；纸张米白 / 墨黑 / 风险朱砂三色；8px spacing scale；4px/8px radius；无渐变。 */
    :root { --font: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif; --mono: "IBM Plex Mono", "SFMono-Regular", monospace; --paper:#f4f0e8; --surface:#fffdf8; --ink:#202321; --muted:#72766f; --line:#d9d5cb; --accent:#176b61; --high:#b64035; --mid:#b47722; --low:#34735b; }
    * { box-sizing: border-box; } body { margin:0; font-family:var(--font); background:#e7e3da; color:var(--ink); }
    button { font:inherit; cursor:pointer; }
    .toolbar { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; background:#161918; color:#fff; position:sticky; top:0; z-index:4; }
    .toolbar-title { font-size:15px; letter-spacing:.06em; font-weight:700; } .toolbar small { color:#9fa7a0; margin-left:12px; font-size:11px; }
    .switcher { display:flex; gap:6px; } .switcher button { border:1px solid #59605a; background:transparent; color:#cdd4cf; padding:8px 13px; border-radius:4px; font-size:12px; }
    .switcher button.active { background:#f4f0e8; color:#161918; border-color:#f4f0e8; font-weight:700; }
    .canvas { min-height:calc(100vh - 64px); padding:34px; }
    .variant { display:none; max-width:1420px; margin:auto; } .variant.active { display:block; }
    .variant-head { display:flex; align-items:end; justify-content:space-between; padding:10px 0 22px; border-bottom:1px solid var(--line); margin-bottom:24px; }
    .eyebrow { font:11px var(--mono); letter-spacing:.14em; color:var(--accent); text-transform:uppercase; } h1 { margin:7px 0 5px; font-size:30px; letter-spacing:-.03em; } .lede { color:var(--muted); font-size:13px; margin:0; }
    .head-meta { text-align:right; color:var(--muted); font-size:12px; line-height:1.8; } .head-meta b { color:var(--ink); }
    .shell { display:grid; grid-template-columns:230px minmax(0,1fr) 330px; min-height:640px; background:var(--surface); border:1px solid var(--line); box-shadow:0 14px 40px rgba(31,34,30,.08); }
    .rail { padding:24px 18px; border-right:1px solid var(--line); background:#eeebe3; } .rail-brand { font-weight:800; font-size:15px; margin-bottom:36px; } .rail-brand span { display:block; color:var(--muted); font-size:11px; font-weight:400; margin-top:5px; }
    .rail-section { font:10px var(--mono); color:#8d928c; letter-spacing:.12em; margin:24px 10px 9px; } .rail a { display:block; padding:10px; margin:2px 0; color:#515750; font-size:13px; text-decoration:none; border-radius:4px; } .rail a.active { background:#d9e6df; color:#155c53; font-weight:700; } .rail a:hover { background:#e1ded6; }
    .workspace { padding:26px 30px; background:var(--surface); } .workspace-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; } .workspace-top h2 { margin:0; font-size:20px; } .status { color:var(--low); font-size:12px; display:flex; gap:7px; align-items:center; } .status i { width:7px; height:7px; background:var(--low); border-radius:50%; display:inline-block; }
    .upload { border:1px dashed #9eaaa0; background:#f5f8f4; min-height:170px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:22px; border-radius:5px; } .upload .glyph { font-size:26px; color:var(--accent); margin-bottom:9px; } .upload strong { font-size:15px; } .upload p { font-size:12px; color:var(--muted); margin:8px 0 0; }
    .or { font:10px var(--mono); color:#9c9f98; text-align:center; margin:15px 0; } .input-line { border:1px solid var(--line); border-radius:4px; color:#a1a49e; font-size:13px; padding:12px 14px; }
    .controls { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:17px; } .seg { display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; } .seg button { border:0; padding:9px 13px; background:transparent; color:var(--muted); font-size:12px; } .seg button.active { background:#e4eee9; color:#145d53; font-weight:700; } .primary { border:0; padding:10px 17px; border-radius:4px; background:var(--accent); color:#fff; font-size:13px; font-weight:700; }
    .pipeline { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:25px; } .step { border-top:2px solid #cdd2cc; padding-top:9px; } .step.done { border-color:var(--low); } .step.current { border-color:var(--accent); } .step b { display:block; font-size:12px; } .step span { color:var(--muted); font-size:11px; }
    .demo { margin-top:27px; border-top:1px solid var(--line); padding-top:18px; } .demo-head { display:flex; justify-content:space-between; align-items:center; } .demo-head b { font-size:13px; } .demo-head span { font-size:11px; color:var(--muted); } .demo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:12px; } .demo-card { border:1px solid var(--line); padding:12px; border-radius:4px; } .demo-card b { display:block; font-size:12px; } .demo-card span { display:block; color:var(--muted); font-size:11px; margin-top:5px; line-height:1.5; } .demo-card.high { border-top:3px solid var(--high); } .demo-card.clean { border-top:3px solid var(--low); } .demo-card.boundary { border-top:3px solid var(--mid); }
    .evidence { padding:24px 20px; border-left:1px solid var(--line); background:#f7f5ef; } .evidence h3 { margin:0 0 16px; font-size:14px; } .risk-score { display:flex; align-items:end; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:15px; } .risk-score strong { font-size:38px; line-height:1; } .risk-score span { color:var(--muted); font-size:11px; } .bars { margin:18px 0 22px; } .bar { display:grid; grid-template-columns:42px 1fr 25px; gap:8px; align-items:center; margin:9px 0; font-size:11px; } .track { height:7px; background:#e4e3dc; border-radius:4px; overflow:hidden; } .fill { height:100%; border-radius:4px; } .fill.high { width:78%; background:var(--high); } .fill.mid { width:50%; background:var(--mid); } .fill.low { width:18%; background:var(--low); }
    .evidence-card { background:#fffdf8; border:1px solid var(--line); border-left:3px solid var(--high); padding:12px; margin-bottom:10px; border-radius:3px; } .evidence-card.mid { border-left-color:var(--mid); } .evidence-card header { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); } .evidence-card strong { display:block; font-size:13px; margin:8px 0 6px; } .evidence-card p { margin:0; font-size:11px; line-height:1.6; color:#5d625d; } .tag { color:var(--high); font-weight:700; } .tag.mid { color:var(--mid); }
    .report-strip { margin-top:18px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; } .report-stat { border:1px solid var(--line); padding:14px; background:#fffdf8; } .report-stat span { display:block; color:var(--muted); font-size:11px; } .report-stat b { display:block; font:24px var(--mono); margin-top:5px; }
    /* variant-specific treatments: same information architecture, deliberately different visual language */
    .v2 { --paper:#e9edf0; --surface:#fbfcfc; --ink:#16202a; --muted:#68747d; --line:#cdd5d9; --accent:#1e5268; --high:#a63d3d; --mid:#9a6b21; --low:#2b6d63; } .v2 .shell { box-shadow:0 16px 35px rgba(18,42,52,.1); border-radius:0; } .v2 .rail { background:#1c2932; color:#dce5e5; border-color:#35434b; } .v2 .rail-brand, .v2 .rail a.active { color:#fff; } .v2 .rail-brand span, .v2 .rail-section, .v2 .rail a { color:#93a7ad; } .v2 .rail a.active { background:#2c4651; } .v2 .workspace { background:#fbfcfc; } .v2 .upload { background:#f0f5f6; border-style:solid; } .v2 .evidence { background:#f1f4f3; } .v2 .primary { background:#1e5268; border-radius:2px; } .v2 .eyebrow { color:#1e5268; }
    .v3 { --paper:#f2f1ed; --surface:#ffffff; --ink:#111; --muted:#6d6d68; --line:#cecec8; --accent:#111; --high:#b23a2f; --mid:#9d6a12; --low:#39745d; } .v3 .shell { grid-template-columns:190px minmax(0,1fr) 360px; border-radius:0; box-shadow:none; border-color:#bdbdb5; } .v3 .rail { background:#fff; } .v3 .rail a { border-radius:0; border-left:2px solid transparent; } .v3 .rail a.active { background:#efefea; color:#111; border-left-color:#111; } .v3 .workspace { padding:28px 40px; } .v3 .workspace-top h2 { font-size:26px; letter-spacing:-.05em; } .v3 .upload { background:#fff; border-radius:0; border-color:#777; min-height:185px; } .v3 .primary { background:#111; border-radius:0; } .v3 .evidence { background:#fff; padding:28px 24px; } .v3 .evidence-card { border-radius:0; } .v3 .report-stat { border-radius:0; }
    @media (max-width:1000px) { .canvas { padding:18px; } .shell { grid-template-columns:190px 1fr; } .evidence { grid-column:1 / -1; border-left:0; border-top:1px solid var(--line); } }
    @media (max-width:680px) { .toolbar { padding:0 14px; } .toolbar small { display:none; } .canvas { padding:10px; } .shell { display:block; } .rail { border-right:0; border-bottom:1px solid var(--line); } .rail a { display:inline-block; } .rail-section { display:none; } .workspace { padding:20px 16px; } .demo-grid, .report-strip, .pipeline { grid-template-columns:1fr; } .head-meta { display:none; } }
  </style>
</head>
<body>

  <main class="canvas">
    <section class="variant v1 active" id="v1"><div class="preview-slot"></div></section>
    <section class="variant v2" id="v2"><div class="preview-slot"></div></section>
    <section class="variant v3" id="v3"><div class="preview-slot"></div></section>
  </main>
  <script>
    const shell = () => `<div class="shell"><aside class="rail"><div class="rail-brand">审查台<span>合同风险工作台</span></div><div class="rail-section">工作区</div><a class="active">上传与审查</a><a>报告详情 <small>7</small></a><div class="rail-section">治理</div><a>评测对比</a><a>设置</a><div class="rail-section">当前项目</div><a>采购合同 / 演示</a></aside><section class="workspace"><div class="workspace-top"><h2>上传一份合同</h2><div class="status"><i></i>离线演示可用</div></div><div class="upload"><div class="glyph">＋</div><strong>拖拽文件到这里，或选择合同文本</strong><p>支持 TXT / MD · 内容仅用于本次审查</p></div><div class="or">或</div><div class="input-line">粘贴合同文本……</div><div class="controls"><div class="seg"><button class="active">采购合同</button><button>销售合同</button></div><button class="primary">开始审查</button></div><div class="pipeline"><div class="step done"><b>条款抽取</b><span>已完成 · 0.8s</span></div><div class="step done"><b>风险识别</b><span>已完成 · 8.4s</span></div><div class="step current"><b>证据复核</b><span>对抗复核与重证</span></div><div class="step"><b>报告生成</b><span>等待中</span></div></div><div class="demo"><div class="demo-head"><b>快速载入演示合同</b><span>离线缓存 · 不调用模型</span></div><div class="demo-grid"><div class="demo-card high"><b>高危采购合同</b><span>4 项高危 · 单方解除 + 90% 预付款</span></div><div class="demo-card clean"><b>干净示范文本</b><span>低误报基线 · 无明显风险</span></div><div class="demo-card boundary"><b>边界争议合同</b><span>验收期 5 天 · 需要人工判断</span></div></div></div></section><aside class="evidence"><h3>风险概览</h3><div class="risk-score"><strong>7</strong><span>项风险<br>12 条款</span></div><div class="bars"><div class="bar"><span>高危</span><div class="track"><div class="fill high"></div></div><b>4</b></div><div class="bar"><span>中危</span><div class="track"><div class="fill mid"></div></div><b>3</b></div><div class="bar"><span>低危</span><div class="track"><div class="fill low"></div></div><b>0</b></div></div><div class="evidence-card"><header><span class="tag">高危</span><span>第四条</span></header><strong>预付款比例过高</strong><p>预付款比例为 90%，且无担保或退款机制。建议降低至 30%，并增加退款责任。</p></div><div class="evidence-card"><header><span class="tag">高危</span><span>第五条</span></header><strong>单方解除条件失衡</strong><p>甲方可随时解除且无需担责。证据：民法典第 496 条（间接依据）。</p></div><div class="evidence-card mid"><header><span class="tag mid">中危</span><span>第三条</span></header><strong>验收期限过短</strong><p>2 个工作日可能无法完成全面检验。建议区分外观与隐蔽瑕疵期限。</p></div></aside></div>`;
    document.querySelectorAll('.preview-slot').forEach(slot => { slot.outerHTML = shell(); });
    document.querySelectorAll('.switcher button').forEach(btn => btn.addEventListener('click', () => { document.querySelectorAll('.switcher button').forEach(b => b.classList.remove('active')); document.querySelectorAll('.variant').forEach(v => v.classList.remove('active')); btn.classList.add('active'); document.getElementById(btn.dataset.target).classList.add('active'); }));
  </script>
</body>
</html>
