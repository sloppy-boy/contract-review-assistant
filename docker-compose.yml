services:
  contract-review-assistant:
    # 生产后端只构建 Python，前端由 EdgeOne Makers 单独构建
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    ports: ["8000:8000"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      REVIEW_RUNS_PATH: /app/data/review_runs.db
      CONTRACT_REVIEW_SETTINGS: /app/data/settings.json
    volumes:
      - review-data:/app/data
    restart: unless-stopped
volumes:
  review-data:
